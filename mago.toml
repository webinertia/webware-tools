#:schema https://mago.carthage.software/1.55.0/schema.json
version = "1.55.0"
php-version = "8.4.1"

[source]
paths = ["src", "test"]
includes = ["vendor"]
excludes = [
    "vendor/nikic/fast-route/test/HackTypechecker/fixtures/all_options.php",
    "vendor/nikic/fast-route/test/HackTypechecker/fixtures/no_options.php",
    "vendor/nikic/fast-route/test/HackTypechecker/fixtures/empty_options.php"
]

[source.glob]
literal-separator = false

[formatter]
preset = "default"
method-chain-breaking-style = "same_line"
preserve-breaking-member-access-chain = true
preserve-breaking-member-access-chain-first-method-on-same-line = true
preserve-breaking-argument-list = true
preserve-breaking-array-like = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-condition-expression = true
preserve-redundant-logical-binary-expression-parentheses = true
preserve-breaking-binary-expression = true
space-after-logical-not-unary-prefix-operator = true
always-break-named-arguments-list = true
align-named-arguments = true
align-assignment-like = true
sort-class-methods = true

[linter]
minimum-fail-level = "Help"
integrations = ["laminas", "phpunit"]

[linter.rules]
literal-named-argument = { enabled = true }
halstead = { effort-threshold = 7000 }
valid-docblock = { enabled = true }
no-negated-ternary = { enabled = true }
no-short-bool-cast = { enabled = true }
no-inline = { enabled = true }
no-array-accumulation-in-loop = { enabled = true }
no-literal-namespace-string = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-side-effects-with-declarations = { enabled = true }
prefer-array-spread = { enabled = true }
prefer-explode-over-preg-split = { enabled = true }
prefer-first-class-callable = { check-functions = true }
prefer-test-attribute = { enabled = true }
require-namespace = { enabled = true }
prefer-pre-increment = { enabled = true }
prefer-self-return-type = { enabled = true }
sorted-integer-keys = { enabled = true }
yoda-conditions = { enabled = true }
file-name = { enabled = true }
array-style = { level = "Help" }
block-statement = { level = "Help" }
braced-string-interpolation = { enabled = true, level = "Help" }
no-alias-function = { level = "Help" }
no-php-tag-terminator = { level = "Help" }
no-trailing-space = { level = "Help" }
string-style = { enabled = true, level = "Help" }
ambiguous-constant-access = { enabled = true }
ambiguous-function-call = { enabled = true }
class-name = { psr = true }
function-name = { camel = true, exclude = ["src/functions/*"] }
interface-name = { psr = true }
method-name = { enabled = true, camel = true }
no-fully-qualified-global-class-like = { enabled = true }
no-fully-qualified-global-constant = { enabled = true }
no-fully-qualified-global-function = { enabled = true }
property-name = { enabled = true }
trait-name = { psr = true }
variable-name = { enabled = true, camel = true, either = false }
too-many-methods = { exclude = ["test/"] }
no-iterator-to-array-in-foreach = { enabled = true }
no-duplicate-match-arm = { level = "Help" }
no-empty-comment = { level = "Help" }
no-empty-loop = { level = "Help" }
no-is-null = { enabled = true, level = "Help" }
no-null-property-init = { enabled = true }
no-redundant-else = { enabled = true }
disallowed-type-instantiation = { enabled = true }
no-debug-symbols = { level = "Help" }
no-assign-in-argument = { enabled = true }
no-dead-store = { enabled = true }
no-redundant-variable = { enabled = true }
no-unused-closure-capture = { enabled = true }
no-unused-global = { enabled = true }
no-unused-static = { enabled = true }
switch-continue-to-break = { enabled = true }
invalid-open-tag = { level = "Help" }

[analyzer]
excludes = ["test", "bench"]
plugins = ["psl", "psr-container"]
find-unused-definitions = true
find-unused-expressions = true
find-overly-wide-return-types = true
analyze-dead-code = true
memoize-properties = true
check-throws = true
unchecked-exceptions = []
unchecked-exception-classes = []
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
strict-array-index-existence = true
allow-array-truthy-operand = false
no-boolean-literal-comparison = true
check-missing-type-hints = true
check-arrow-function-missing-type-hints = true
register-super-globals = false
check-property-initialization = true
check-use-statements = true
check-name-casing = true
enforce-class-finality = true
require-api-or-internal = true
class-initializers = [
    "PhpDb\\ResultSet\\AbstractResultSet::initialize",
    "PHPUnit\\Framework\\TestCase::setUp",
    "Laminas\\Form\\Element::init",
    "Laminas\\InputFilter\\BaseInputFilter::init"
]

# Ecosystem-wide guard rules. Every consumer extends this file, so a rule added here applies to every
# package after its next dependency update. Roots use `{App,Webware}` so consumer applications (`App\`)
# are held to the same conventions as packages. `**` matches zero or more namespace segments.
[guard]
mode = "default"

# Naming
[[guard.structural.rules]]
on = "{App,Webware}\\**"
target = "interface"
must-be-named = "*Interface"
reason = "Interfaces must follow the *Interface naming convention."

[[guard.structural.rules]]
on = "{App,Webware}\\**"
target = "trait"
must-be-named = "*Trait"
reason = "Traits must follow the *Trait naming convention."

# A namespace segment never repeats its parent segment. The repeated segment shadows any class of the
# same name in the parent namespace: `Webware\Acl\Acl` collided with the root `Webware\Acl\Acl` class
# and forced `ConfigProvider` to use `Acl` as both a class alias and a namespace prefix.
#
# Every entry is a two-segment package root repeating itself, so a leaf namespace that shares a name
# with its parent at depth (`Webware\Log\Handler\Handler`) is deliberately not swept in. A new package
# root is added here, the same maintenance obligation the PhpDb enumeration carries.
#
# The pattern ends `\**\*` rather than `\**` because `on` is matched against the fully qualified
# symbol name, not the namespace: a trailing `\**` also matches the root class itself
# (`Webware\MessageBus\MessageBus`, `Webware\Event\Event`, `Webware\Mailer\Mailer`), which are
# correct names. `must-be = []` bans every symbol kind in the namespace, which is why `target` is
# omitted: `target = "class"` would let an interface, enum or function in the same namespace escape.
[[guard.structural.rules]]
on = "{App,Webware,AppTest,AppTestIntegration,WebwareTest,WebwareTestIntegration}\\{Acl\\Acl,Admin\\Admin,Async\\Async,Console\\Console,Core\\Core,Event\\Event,Htmx\\Htmx,Log\\Log,Mailer\\Mailer,Message\\Message,MessageBus\\MessageBus,Migration\\Migration,Navigation\\Navigation,ResultSet\\ResultSet,Theme\\Theme,Traccio\\Traccio,UserManager\\UserManager,Validator\\Validator}\\**\\*"
must-be = []
reason = "A namespace segment must not repeat its parent segment."

# Http
[[guard.structural.rules]]
on = "{App,Webware}\\**\\Http\\**\\Middleware\\*"
target = "class"
must-be-named = "*Middleware"
must-implement = "Psr\\Http\\Server\\MiddlewareInterface"
reason = "Http middleware lives in Http\\Middleware and implements PSR-15 MiddlewareInterface."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Http\\**\\RequestHandler\\*"
target = "class"
must-be-named = "*Handler"
must-implement = "Psr\\Http\\Server\\RequestHandlerInterface"
reason = "Http request handlers live in Http\\RequestHandler and implement PSR-15 RequestHandlerInterface."

# PSR-15 is usable only from Http\ and tests. `Webware\Async\**` is a deliberate permit: a runner must
# accept a request handler. The App permit is `App\**\Http\**` only, so PSR-15 classes elsewhere in an app
# fail; that is the forcing function.
[[guard.perimeter.restrictions]]
dependency = "Psr\\Http\\Server\\**"
allow-from = [
    "{App,Webware}\\**\\Http\\**",
    "{AppTest,AppTestIntegration,WebwareTest,WebwareTestIntegration}\\**",
    "Webware\\Async\\**",
]

# Message bus
# Messages live in per-type namespaces of their own domain, never in a MessageBus\ bucket. `not-on` excludes
# the bus package, which the `Webware` half of the brace would otherwise match. `must-implement` sees directly
# declared interfaces only, so commands are held to `NamedCommandInterface`.
[[guard.structural.rules]]
on = "{App,Webware}\\**\\Command\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Command"
must-be-final = true
must-implement = "Webware\\MessageBus\\Command\\NamedCommandInterface"
reason = "Commands live in Command\\, are named *Command, implement NamedCommandInterface, and are final."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\CommandHandler\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Handler"
must-implement = "Webware\\MessageBus\\CommandHandlerInterface"
reason = "Command handlers live in CommandHandler\\, are named *Handler, and implement CommandHandlerInterface."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Query\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Query"
must-be-final = true
must-implement = "Webware\\MessageBus\\Query\\QueryInterface"
reason = "Queries live in Query\\, are named *Query, implement QueryInterface, and are final."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\QueryHandler\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Handler"
must-implement = "Webware\\MessageBus\\QueryHandlerInterface"
reason = "Query handlers live in QueryHandler\\, are named *Handler, and implement QueryHandlerInterface."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\MessageBus\\Middleware\\*"
target = "class"
must-be-named = "*Middleware"
must-implement = "Webware\\MessageBus\\MiddlewareInterface"
reason = "Bus middleware lives in MessageBus\\Middleware and implements the bus MiddlewareInterface."

# Console
# `Console\` is Symfony's CLI surface and `Command\` is the bus's; guard matches namespaces only, so each needs
# its own rule. Direct children only: a command's factory nests in `Console\Container\`. `not-on` excludes
# webware-console, whose root namespace would otherwise match; it keeps its commands at its package root.
# `must-use-attribute` identifies a Symfony command, since a parent class cannot be expressed.
[[guard.structural.rules]]
on = "{App,Webware}\\**\\Console\\*"
not-on = "Webware\\Console\\**"
target = "class"
must-be-named = "*Command"
must-be-final = true
must-use-attribute = "Symfony\\Component\\Console\\Attribute\\AsCommand"
reason = "Console commands live in Console\\, are named *Command, are final, and carry #[AsCommand]."

# PSR-14 events
# Only placement and naming are constrained, with no `must-implement`, so the mechanism can be adopted
# incrementally. Direct children only: a listener's factory nests in `Listener\Container\`. `not-on` excludes
# the bus package and webware-event itself, whose root namespace is `Webware\Event` and would match its own
# classes. `not-on` takes a single string (a list is a config error) and accepts brace alternation.
[[guard.structural.rules]]
on = "{App,Webware}\\**\\Event\\*"
not-on = "{Webware\\MessageBus,Webware\\Event}\\**"
target = "class"
must-be-named = "*Event"
reason = "Events live in Event\\ and are named *Event."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Listener\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Listener"
reason = "Listeners live in Listener\\ and are named *Listener, with factories in Listener\\Container\\."

# Persistence boundary
# Repositories are reached only from the handlers that use them (reads in query handlers, writes in command
# handlers), DI factories, the composition root, console commands, `Webware\Migration\**` (the migration
# runner) and tests. Every restriction is mirrored for `App\`.
#
# `allow-from` selects source namespaces. `Webware\*` is the two-segment composition root (`Webware\Acl`). A
# one-segment root has no equivalent: `App` or `App\` admits everything beneath it and `App\*` admits every
# first-level namespace, so the App composition root is not permitted. A consumer that needs it adds a local rule.
# An exact symbol entry permits nothing.
[[guard.perimeter.restrictions]]
dependency = "Webware\\**\\Repository\\**"
allow-from = [
    "Webware\\*",
    "Webware\\**\\Repository\\**",
    "Webware\\**\\QueryHandler\\**",
    "Webware\\**\\CommandHandler\\**",
    "Webware\\**\\Container\\**",
    "Webware\\**\\Console\\**",
    "Webware\\Migration\\**",
    "WebwareTest\\**",
    "WebwareTestIntegration\\**",
]

[[guard.perimeter.restrictions]]
dependency = "App\\**\\Repository\\**"
allow-from = [
    "App\\**\\Repository\\**",
    "App\\**\\QueryHandler\\**",
    "App\\**\\CommandHandler\\**",
    "App\\**\\Container\\**",
    "App\\**\\Console\\**",
    "AppTest\\**",
    "AppTestIntegration\\**",
]

# PhpDb stays behind the persistence boundary, except `ResultSet` (a legitimate return type) and `Validator`.
# The first restriction lists every namespace except those two: a new PhpDb namespace must be added here.
# `ConfigProvider`, `Pgsql`, `SchemaFactory`, `SchemaInterface`, `Sqlite` and `WebwareProvider` were
# absent from the enumeration, so the boundary silently did not cover them.
#
# `Webware\Traccio\**` is admitted on the same footing as `Webware\Migration\**`: Traccio is a profiler,
# so it reads the adapter, the profiler and the Sql DDL types to render its panels and persists nothing
# of its own. Only the three namespaces that actually touch PhpDb are listed - `Debug\` renders the
# panels, `PhpDb\` holds the delegator that installs the profiler, and `Http\` wires both into the
# middleware stack. A boundary rule must not block a legitimate consumer.
[[guard.perimeter.restrictions]]
dependency = "PhpDb\\{Adapter,ConfigProvider,Container,Exception,Feature,Metadata,Mysql,Pgsql,RowGateway,SchemaFactory,SchemaInterface,Session,Sql,Sqlite,TableGateway,WebwareProvider}\\**"
allow-from = [
    "PhpDb\\**",
    "App\\**\\Entity\\**",
    "App\\**\\Repository\\**",
    "App\\**\\QueryHandler\\**",
    "App\\**\\CommandHandler\\**",
    "App\\**\\Console\\**",
    "AppTest\\**",
    "AppTestIntegration\\**",
    "Webware\\*",
    "Webware\\Core\\**",
    "Webware\\Log\\Handler\\**",
    "Webware\\Migration\\**",
    "Webware\\Traccio\\Debug\\**",
    "Webware\\Traccio\\Http\\**",
    "Webware\\Traccio\\PhpDb\\**",
    "Webware\\**\\Entity\\**",
    "Webware\\**\\Repository\\**",
    "Webware\\**\\QueryHandler\\**",
    "Webware\\**\\CommandHandler\\**",
    "Webware\\**\\Console\\**",
    "WebwareTest\\**",
    "WebwareTestIntegration\\**",
    "Webware\\**\\Validator\\**",
]

# Validators are attached to input filters.
[[guard.perimeter.restrictions]]
dependency = "PhpDb\\Validator\\**"
allow-from = [
    "PhpDb\\**",
    "Webware\\**\\InputFilter\\**",
    "Webware\\**\\Validator\\**",
    "WebwareTest\\**",
    "WebwareTestIntegration\\**",
    "App\\**\\InputFilter\\**",
    "AppTest\\**",
    "AppTestIntegration\\**",
]

# Symfony Console is the CLI surface. Commands and their support classes live under `Console\`, so the
# dependency is reachable from a `Console\` namespace and from tests, and from nowhere else. A console
# implementation package is one whose own root is `Console\` (`Webware\Console`, `PhpDb\Session\Console`),
# which the `\**\Console\**` form admits because `**` matches zero segments.
[[guard.perimeter.restrictions]]
dependency = "Symfony\\Component\\Console\\**"
allow-from = [
    "Webware\\**\\Console\\**",
    "App\\**\\Console\\**",
    "PhpDb\\**\\Console\\**",
    "WebwareTest\\**",
    "WebwareTestIntegration\\**",
    "AppTest\\**",
    "AppTestIntegration\\**",
]

# Request handlers are render-only. Data collection and mutation happen in PSR middleware, which composes
# anywhere in the pipeline; a handler sits at the terminal end. A handler that holds the bus can dispatch
# anything, so the boundary is the interface itself and not the bus namespace: `CommandResult` and
# `MessageStatus` are render inputs and stay available. The pattern also covers `RequestHandler\Container\**`,
# which is where a handler's factory resolves the bus today; the factory comes off the bus with its handler.
[[guard.perimeter.restrictions]]
dependency = "Webware\\MessageBus\\{MessageBusInterface,MessageBus}"
deny-from = ["{App,Webware}\\**\\Http\\**\\RequestHandler\\**"]

# Repositories stay bus-agnostic: they persist rows and never speak the bus's message contracts. A write is
# reached by dispatching a command from a command handler, not by handing a command object to a repository.
[[guard.perimeter.restrictions]]
dependency = "Webware\\MessageBus\\**"
deny-from = ["{App,Webware}\\**\\Repository\\**"]

# The two components are mutually independent: webware-acl must not depend on webware-usermanager, which
# would be a circular dependency between the authorization layer and a consumer of it.
[[guard.perimeter.restrictions]]
dependency = "Webware\\UserManager\\**"
deny-from = ["Webware\\Acl\\**"]
