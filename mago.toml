#:schema https://mago.carthage.software/1.50.0/schema.json
version = "1.50.0"
php-version = "8.4.1"

[source]
paths = ["src", "test"]
includes = ["vendor"]
excludes = [
    "vendor/nikic/fast-route/test/HackTypechecker/fixtures/all_options.php",
    "vendor/nikic/fast-route/test/HackTypechecker/fixtures/no_options.php",
    "vendor/nikic/fast-route/test/HackTypechecker/fixtures/empty_options.php"
]

[source.glob]
literal-separator = false

[formatter]
preset = "default"
method-chain-breaking-style = "same_line"
preserve-breaking-member-access-chain = true
preserve-breaking-member-access-chain-first-method-on-same-line = true
preserve-breaking-argument-list = true
preserve-breaking-array-like = true
preserve-breaking-parameter-list = true
preserve-breaking-attribute-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-condition-expression = true
preserve-redundant-logical-binary-expression-parentheses = true
preserve-breaking-binary-expression = true
space-after-logical-not-unary-prefix-operator = true
always-break-named-arguments-list = true
align-named-arguments = true
align-assignment-like = true
sort-class-methods = true

[linter]
minimum-fail-level = "Help"
integrations = ["laminas", "phpunit"]

[linter.rules]
literal-named-argument = { enabled = true }
halstead = { effort-threshold = 7000 }
valid-docblock = { enabled = true }
no-negated-ternary = { enabled = true }
no-short-bool-cast = { enabled = true }
no-inline = { enabled = true }
no-array-accumulation-in-loop = { enabled = true }
no-literal-namespace-string = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-side-effects-with-declarations = { enabled = true }
prefer-array-spread = { enabled = true }
prefer-explode-over-preg-split = { enabled = true }
prefer-first-class-callable = { check-functions = true }
prefer-test-attribute = { enabled = true }
require-namespace = { enabled = true }
prefer-pre-increment = { enabled = true }
prefer-self-return-type = { enabled = true }
sorted-integer-keys = { enabled = true }
yoda-conditions = { enabled = true }
file-name = { enabled = true }
array-style = { level = "Help" }
block-statement = { level = "Help" }
braced-string-interpolation = { enabled = true, level = "Help" }
no-alias-function = { level = "Help" }
no-php-tag-terminator = { level = "Help" }
no-trailing-space = { level = "Help" }
string-style = { enabled = true, level = "Help" }
ambiguous-constant-access = { enabled = true }
ambiguous-function-call = { enabled = true }
class-name = { psr = true }
function-name = { camel = true, exclude = ["src/functions/*"] }
interface-name = { psr = true }
method-name = { enabled = true, camel = true }
no-fully-qualified-global-class-like = { enabled = true }
no-fully-qualified-global-constant = { enabled = true }
no-fully-qualified-global-function = { enabled = true }
property-name = { enabled = true }
trait-name = { psr = true }
variable-name = { enabled = true, camel = true, either = false }
too-many-methods = { exclude = ["test/"] }
no-iterator-to-array-in-foreach = { enabled = true }
no-duplicate-match-arm = { level = "Help" }
no-empty-comment = { level = "Help" }
no-empty-loop = { level = "Help" }
no-is-null = { enabled = true, level = "Help" }
no-null-property-init = { enabled = true }
no-redundant-else = { enabled = true }
disallowed-type-instantiation = { enabled = true }
no-debug-symbols = { level = "Help" }
no-assign-in-argument = { enabled = true }
no-dead-store = { enabled = true }
no-redundant-variable = { enabled = true }
no-unused-closure-capture = { enabled = true }
no-unused-global = { enabled = true }
no-unused-static = { enabled = true }
switch-continue-to-break = { enabled = true }
invalid-open-tag = { level = "Help" }

[analyzer]
excludes = ["test", "bench"]
plugins = ["psl", "psr-container"]
find-unused-definitions = true
find-unused-expressions = true
find-overly-wide-return-types = true
analyze-dead-code = true
memoize-properties = true
check-throws = true
unchecked-exceptions = []
unchecked-exception-classes = []
check-missing-override = true
find-unused-parameters = true
strict-list-index-checks = true
strict-array-index-existence = true
allow-array-truthy-operand = false
no-boolean-literal-comparison = true
check-missing-type-hints = true
check-arrow-function-missing-type-hints = true
register-super-globals = false
check-property-initialization = true
check-use-statements = true
check-name-casing = true
enforce-class-finality = true
require-api-or-internal = true
class-initializers = [
    "PhpDb\\ResultSet\\AbstractResultSet::initialize",
    "PHPUnit\\Framework\\TestCase::setUp",
    "Laminas\\Form\\Element::init",
    "Laminas\\InputFilter\\BaseInputFilter::init"
]

# ---------------------------------------------------------------------------
# Guard rules: the ecosystem-wide boundary contract.
#
# This is the centre: every consumer extends this file, so a rule added here is
# enforced in every package the moment the consumer updates its dependency. The
# doctrine behind these rules lives in the preset constitution (Principles I, V
# and VIII); the exact TOML lives here so the two cannot drift apart.
#
# `mode = "default"` runs both structural and perimeter checks.
#
# Rule roots use a brace alternation, `{App,Webware}`, so the same convention is
# enforced on the packages and on consumer application code (`App\`, the Mezzio
# default module). Verified against mago 1.50.0: brace alternation is supported in
# a structural `on`, and `**` matches ZERO OR MORE namespace segments, so
# `{App,Webware}\**\Command\*` covers both `Webware\Acl\Command\X` and
# `App\Command\X`.
# ---------------------------------------------------------------------------
[guard]
mode = "default"

# --- Naming conventions ----------------------------------------------------

[[guard.structural.rules]]
on = "{App,Webware}\\**"
target = "interface"
must-be-named = "*Interface"
reason = "Interfaces must follow the *Interface naming convention."

[[guard.structural.rules]]
on = "{App,Webware}\\**"
target = "trait"
must-be-named = "*Trait"
reason = "Traits must follow the *Trait naming convention."

# --- Http perimeter --------------------------------------------------------
#
# PSR-15 implementations live under Http\. The `**` segment in the namespace
# lets one rule cover both the top-level layout (Http\Middleware\) and the
# admin-nested one (Http\Admin\Middleware\, Http\Admin\RequestHandler\).

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Http\\**\\Middleware\\*"
target = "class"
must-be-named = "*Middleware"
must-implement = "Psr\\Http\\Server\\MiddlewareInterface"
reason = "Http middleware lives in Http\\Middleware and implements PSR-15 MiddlewareInterface."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Http\\**\\RequestHandler\\*"
target = "class"
must-be-named = "*Handler"
must-implement = "Psr\\Http\\Server\\RequestHandlerInterface"
reason = "Http request handlers live in Http\\RequestHandler and implement PSR-15 RequestHandlerInterface."

# Psr\Http\Server\** is usable only from the Http\ perimeter and the tests that
# exercise those classes. Webware\Async\** is a deliberate permit: a runner must
# accept a PSR-15 request handler. The entry-point contract still belongs to the
# Http\ boundary; this permit does not move it.
#
# The App permit is deliberately `App\**\Http\**` only. A consumer that keeps
# PSR-15 classes outside Http\ (for example `App\Middleware\` or
# `App\RequestHandler\`) goes red. That is the forcing function for the move.
[[guard.perimeter.restrictions]]
dependency = "Psr\\Http\\Server\\**"
allow-from = [
    "{App,Webware}\\**\\Http\\**",
    "{AppTest,AppTestIntegration,WebwareTest,WebwareTestIntegration}\\**",
    "Webware\\Async\\**",
]

# --- Message bus -----------------------------------------------------------
#
# Message classes conform by per-type sub-namespace in the domain they act on
# (Command\, CommandHandler\, Query\, QueryHandler\): they are never relocated
# into a MessageBus\ bucket, so `MessageBus\Middleware\` (bus middleware) stays
# distinguishable from `Http\Middleware\` (PSR middleware).
#
# The `not-on` entries are load-bearing: the Webware half of a brace also matches
# the bus contracts themselves (`Webware\MessageBus\Command\CommandInterface`)
# and messagebus-event's `Webware\MessageBus\Event\Command\*` classes.
#
# `must-implement` matches the interfaces a class declares directly (it does not
# traverse inheritance), so the enforced contract is the one commands implement:
# `NamedCommandInterface`, which itself extends `CommandInterface`.

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Command\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Command"
must-be-final = true
must-implement = "Webware\\MessageBus\\Command\\NamedCommandInterface"
reason = "Commands live in Command\\, are named *Command, implement NamedCommandInterface, and are final."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\CommandHandler\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Handler"
must-implement = "Webware\\MessageBus\\CommandHandlerInterface"
reason = "Command handlers live in CommandHandler\\, are named *Handler, and implement CommandHandlerInterface."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Query\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Query"
must-be-final = true
must-implement = "Webware\\MessageBus\\Query\\QueryInterface"
reason = "Queries live in Query\\, are named *Query, implement QueryInterface, and are final."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\QueryHandler\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Handler"
must-implement = "Webware\\MessageBus\\QueryHandlerInterface"
reason = "Query handlers live in QueryHandler\\, are named *Handler, and implement QueryHandlerInterface."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\MessageBus\\Middleware\\*"
target = "class"
must-be-named = "*Middleware"
must-implement = "Webware\\MessageBus\\MiddlewareInterface"
reason = "Bus middleware lives in MessageBus\\Middleware and implements the bus MiddlewareInterface."

# --- Console ---------------------------------------------------------------
#
# Console commands are Symfony's, not the bus's. The two namespaces share a word
# and nothing else: `Command\` is the message bus's (production-facing messages,
# above), `Console\` is the CLI surface. Both are in use side by side in the same
# package today — webware-usermanager and webware-migration each carry
# `src/Command/...` (bus) beside `src/Console/...` (CLI) — so the namespace IS
# the discriminator, and a rule is what keeps it one.
#
# A single `Command\` cannot host both kinds: guard matching is namespace-scoped
# only (`on` / `not-on` / `target` plus all-AND constraints, with no predicate on
# parent class), so admitting console commands there would mean dropping
# `must-implement` for every bus command. Hence a second namespace with its own
# rule rather than a widened first one.
#
# `\Console\*` matches DIRECT CHILDREN ONLY, like Command\, CommandHandler\,
# Query\, QueryHandler\, Event\ and Listener\. A command's DI factory therefore
# nests one level deeper in `Console\Container\` and is out of scope by
# construction, exactly as middleware factories nest in
# `Http\Middleware\Container\`.
#
# `not-on` excludes the console package wholesale, the same way `not-on` excludes
# `Webware\MessageBus\**` above and `Webware\Event\**` in the PSR-14 rules
# below. `**` matches ZERO OR MORE segments, so a package whose ROOT namespace is
# `Console` matches this pattern through its own root: `Webware\Console\App`
# and `Webware\Console\ConfigProvider` read as `<root>\Console\<class>`. The
# package that IMPLEMENTS the convention is not the thing being policed; the
# components and applications that write commands are. webware-console therefore
# keeps its own commands at its package root
# (`Webware\Console\DevelopmentModeCommand`) with their factories in `Container\`
# beside the others, rather than in a `Console\Console\` duplicate segment.
#
# `target = "class"` scopes the rule to classes, so an interface occupying a
# matched namespace is never reported. `must-be = ["class"]` is deliberately NOT
# used: it constrains which symbol kinds a matched NAMESPACE may contain, so it
# would report such an interface as a foreign symbol rather than ignore it.
#
# `must-use-attribute` is what ties the namespace to Symfony rather than to a
# naming habit: a class's parent is not expressible here (`must-implement` sees
# directly-declared interfaces only, and Symfony's `Command` is a class), so the
# attribute is the constraint that can say "is a console command". Every command
# in the fleet already carries it.
#
# Two classes sit in this rule's path and RELOCATE, they do not break, on their
# next tools bump: `Webware\Acl\Console\AclSchema` and
# `Webware\UserManager\Console\UserSchema` move to `Console\Schema\` — the nesting
# `Console\Ddl\Column\` already uses. That is the forcing function, not breakage.

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Console\\*"
not-on = "Webware\\Console\\**"
target = "class"
must-be-named = "*Command"
must-be-final = true
must-use-attribute = "Symfony\\Component\\Console\\Attribute\\AsCommand"
reason = "Console commands live in Console\\, are named *Command, are final, and carry #[AsCommand]."

# --- PSR-14 events ---------------------------------------------------------
#
# webware-event owns the event mechanism and the contracts every component
# consumes (`Webware\Event\EventInterface`, `ListenerInterface`). The convention
# enforced here is deliberately limited to the two things that make an event
# graph readable: where a class lives, and what it is called.
#
# Both rules carry the `{App,Webware}` root, so a consumer that extends this file
# takes them for its application code as well as for its packages: an app's
# `App\Event\SendWelcomeEvent` and its listeners are held to the same convention
# as a package's. Installing webware-tools is the opt-in. There is no
# consumer-side disable and no App carve-out.
#
# Nothing here constrains behaviour. A listener may implement `ListenerInterface`
# directly, extend a package base class, or be registered by the package's own
# provider - there is no `must-implement`, no `must-be-final`, and no dependency
# restriction on any event library, so the mechanism can be adopted
# incrementally. Adding one later would be a boundary change, not a naming fix.
#
# `\Event\*` and `\Listener\*` match DIRECT CHILDREN ONLY, same as the Command\ and
# Query\ rules. One consequence is intended: a listener's DI factory nests one
# level deeper in `Listener\Container\`, exactly as middleware factories nest in
# `Http\Middleware\Container\`, because a factory is named for the class it builds
# and cannot satisfy `*Listener` without it. webware-usermanager already sits this
# way, webware-log included: its `Listener\Container\Psr3LogPsr14ListenerFactory`
# moved, so no package is out of line on this rule today.
#
# `not-on` excludes two roots:
#
#   Webware\MessageBus\**  the bus and its integration package, whose event
#                          classes are bus types under the bus root
#                          (`Webware\MessageBus\Event\...`). Reconciling that
#                          package against webware-event is tracked in
#                          webinertia/webware-tools#21; the parent boundary
#                          doctrine landed as constitution Principle VIII.
#   Webware\Event\**       the contract package itself. Its ROOT namespace is
#                          `Webware\Event`, so `\**\Event\*` matches its root
#                          classes as if they were events - and `ConfigProvider`
#                          does not end in `Event`. Excluding the package is the
#                          fix; renaming its ConfigProvider would be the wrong
#                          one. This is a namespace collision, not an exemption:
#                          an application's `App\Event\` really is its event
#                          bucket and stays fully in scope.
#
# Verified against mago 1.50.0: `target = "class"` scopes a naming rule to classes
# only, so `EventInterface` / `ListenerInterface` are never reported - the
# contract packages stay out of scope even where they occupy a matching
# namespace. A class whose name repeats its namespace segment
# (`Webware\Event\Event`) is accepted, because `*` matches an empty run. `not-on`
# takes a single string (a list is rejected as a config error) and accepts brace
# alternation, which is what lets one rule carry both exclusions.

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Event\\*"
not-on = "{Webware\\MessageBus,Webware\\Event}\\**"
target = "class"
must-be-named = "*Event"
reason = "Events live in Event\\ and are named *Event."

[[guard.structural.rules]]
on = "{App,Webware}\\**\\Listener\\*"
not-on = "Webware\\MessageBus\\**"
target = "class"
must-be-named = "*Listener"
reason = "Listeners live in Listener\\ and are named *Listener, with factories in Listener\\Container\\."

# --- Persistence boundary --------------------------------------------------
#
# Repositories are reachable only from the handlers that use them, the DI
# factories that wire them, the composition root (the two-segment root
# namespace, e.g. Webware\Acl, which is what `Webware\*` matches), console
# commands, and tests. `allow-from` matches the source *namespace*, prefix
# matches sub-namespaces, and is never path-based.
#
# Every restriction is mirrored for the host application (`App\`, with
# `AppTest\**` / `AppTestIntegration\**` for tests), so an app is held to the
# same boundary its packages are.
#
# One deliberate asymmetry: `allow-from` entries select SOURCE NAMESPACES. The
# centre's `Webware\*` is narrow only because a component root is two segments
# (`Webware\Acl`, the composition root). A one-segment root has no equivalent:
# bare `App` and `App\` permit everything beneath the root, `App\*` permits every
# first-level namespace (`App\Repository`, `App\RequestHandler`, `App\Middleware`)
# and so defeats the restriction, and an exact symbol entry permits nothing at
# all. The App composition root is therefore NOT permitted. A consumer whose
# composition root genuinely needs direct persistence access adds a
# domain-specific local rule, which the doctrine allows. Verified mago 1.50.0.

# Repositories are the read/write boundary, not a persistence preference: reads
# belong to the query handlers and writes to the command handlers, so this rule
# is what holds the bus boundary together. Beyond those roles, one package
# reaches repositories by its nature: Webware\Migration\** (the migration
# tooling), whose runner drives persistence directly. That is the same package
# the PhpDb restriction below already admits, on the same grounds - a rule that
# omitted it would block a legitimate consumer rather than correct one.
[[guard.perimeter.restrictions]]
dependency = "Webware\\**\\Repository\\**"
allow-from = [
    "Webware\\*",
    "Webware\\**\\Repository\\**",
    "Webware\\**\\QueryHandler\\**",
    "Webware\\**\\CommandHandler\\**",
    "Webware\\**\\Container\\**",
    "Webware\\**\\Console\\**",
    "Webware\\Migration\\**",
    "WebwareTest\\**",
    "WebwareTestIntegration\\**",
]

[[guard.perimeter.restrictions]]
dependency = "App\\**\\Repository\\**"
allow-from = [
    "App\\**\\Repository\\**",
    "App\\**\\QueryHandler\\**",
    "App\\**\\CommandHandler\\**",
    "App\\**\\Container\\**",
    "App\\**\\Console\\**",
    "AppTest\\**",
    "AppTestIntegration\\**",
]

# PhpDb\** stays behind the persistence boundary, so ResultSet/RowPrototype
# types never reach middleware, Http handlers, or query payloads. Beyond the
# boundary types above, three packages touch PhpDb by their nature:
# Webware\Core\** (the schema/persistence contract home), Webware\Log\Handler\**
# (the DB log handler), and Webware\Migration\** (the migration tooling).
[[guard.perimeter.restrictions]]
dependency = "PhpDb\\**"
allow-from = [
    "App\\**\\Entity\\**",
    "App\\**\\Repository\\**",
    "App\\**\\QueryHandler\\**",
    "App\\**\\CommandHandler\\**",
    "App\\**\\Console\\**",
    "AppTest\\**",
    "AppTestIntegration\\**",
    "Webware\\*",
    "Webware\\Core\\**",
    "Webware\\Log\\Handler\\**",
    "Webware\\Migration\\**",
    "Webware\\**\\Entity\\**",
    "Webware\\**\\Repository\\**",
    "Webware\\**\\QueryHandler\\**",
    "Webware\\**\\CommandHandler\\**",
    "Webware\\**\\Console\\**",
    "WebwareTest\\**",
    "WebwareTestIntegration\\**",
]
